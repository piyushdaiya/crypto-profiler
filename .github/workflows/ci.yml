name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Install Security Tools
        run: make security-tools

      - name: govulncheck
        run: make govulncheck

      - name: gosec
        run: make gosec

  docker-smoke:
    runs-on: ubuntu-latest
    needs: build-test-security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t crypto-profiler .

      - name: Compose smoke test
        run: |
          docker compose up -d
          docker compose ps
          docker compose down
