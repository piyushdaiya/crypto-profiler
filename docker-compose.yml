services:
  # -------------------------------------------------------
  # SERVICE 1: Watchlist Engine / Crypto Profiler Server
  # -------------------------------------------------------
  engine:
    image: crypto-profiler:latest
    container_name: crypto-profiler-engine
    command: ["server"]
    volumes:
      - crypto-profiler_ofac-data:/data
    environment:
      - DB_PATH=/data/watchlist.db
      - BOOTSTRAP_LABELS_PATH=/root/data/labels/bootstrap_entities.json
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # SERVICE 2: Validator CLI
  # -------------------------------------------------------
  validator:
    image: crypto-profiler:latest
    container_name: crypto-profiler-validator
    entrypoint: ["tail", "-f", "/dev/null"]
    depends_on:
      - engine
    environment:
      - WATCHLIST_ENGINE_URL=http://crypto-profiler-engine:8080
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - COINSTATS_API_KEY=${COINSTATS_API_KEY:-}
      - BOOTSTRAP_LABELS_PATH=/root/data/labels/bootstrap_entities.json

volumes:
  crypto-profiler_ofac-data:
    name: crypto-profiler_ofac-data
    driver: local

networks:
  default:
    name: crypto-profiler_default